<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Imantopia</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  position: fixed;
  inset: 0;
}

.image-wrapper {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;
  background: #000;
}

.image-wrapper img {
  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: 30% 50%;

  display: block;
}


/* =================================
   INVISIBLE CLICKABLE AREAS
   ================================= */

.link {
  position: absolute;

  display: block;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;

  /*
    Invisible while keeping the clickable
    areas easy to adjust.
  */

  background: transparent;
}


/* =================================
   MOBILE PORTRAIT
   ================================= */

@media (max-width: 768px) and (orientation: portrait) {

  .image-wrapper img {
    object-position: 35% 50%;
  }

}

</style>
</head>


<body>

<div class="image-wrapper">

  <picture>

    <source
      srcset="mobile-portrait.jpg"
      media="(max-width: 768px) and (orientation: portrait)"
    >

    <img
      src="imantopia.jpg"
      alt="Imantopia"
    >

  </picture>


  <!-- ==============================
       PORTFOLIO
       handwritten word:
       approximately x 38% / y 31%
       ============================== -->

  <a
    href="/portfolio"
    class="link"
    id="portfolio"
  ></a>


  <!-- ==============================
       BIO
       handwritten word:
       approximately x 55% / y 34%
       ============================== -->

  <a
    href="/bio"
    class="link"
    id="bio"
  ></a>


  <!-- ==============================
       MANUSCRIPT
       handwritten word:
       approximately x 29% / y 43%
       ============================== -->

  <a
    href="/manuscript"
    class="link"
    id="manuscript"
  ></a>


  <!-- ==============================
       BLOG
       handwritten word:
       approximately x 63% / y 45%
       ============================== -->

  <a
    href="https://imanbenerrabeh.com"
    class="link"
    id="blog"
  ></a>


  <!-- ==============================
       NEWSLETTER
       handwritten word:
       approximately x 37% / y 58%
       ============================== -->

  <a
    href="https://buttondown.com/imanbenerrabeh"
    class="link"
    id="newsletter"
  ></a>


  <!-- ==============================
       CHANNEL
       handwritten word:
       approximately x 55% / y 58%
       ============================== -->

  <a
    href="https://www.youtube.com/@imanbenerrabeh"
    class="link"
    id="channel"
  ></a>


</div>


<script>

/*
====================================================
DESKTOP HOTSPOTS
====================================================

Coordinates are based on the actual writing
in imantopia.jpg.

x = horizontal position
y = vertical position
w = clickable width
h = clickable height

All values are percentages of the original image.

The boxes are deliberately slightly larger than
the handwriting so they are easy to click.
====================================================
*/

const desktopHotspots = {

  portfolio: {
    x: 37.0,
    y: 29.5,
    w: 9.0,
    h: 5.5
  },

  bio: {
    x: 53.5,
    y: 32.0,
    w: 6.5,
    h: 5.5
  },

  manuscript: {
    x: 28.0,
    y: 41.0,
    w: 10.5,
    h: 5.5
  },

  blog: {
    x: 62.0,
    y: 43.0,
    w: 7.0,
    h: 5.5
  },

  newsletter: {
    x: 35.0,
    y: 55.5,
    w: 10.0,
    h: 6.0
  },

  channel: {
    x: 54.0,
    y: 55.0,
    w: 9.0,
    h: 6.0
  }

};


/*
====================================================
MOBILE HOTSPOTS
====================================================

These coordinates are calibrated specifically to
mobile-portrait.jpg.

Unlike the previous version, these are NOT six
screen quadrants.

Each hotspot is positioned over the actual
handwritten word in the mobile photograph.

Approximate handwritten positions in the supplied
mobile photograph:

portfolio  -> upper-left
bio        -> upper-right
manuscript -> middle-left
blog       -> middle-right
newsletter -> lower-left
channel    -> lower-right

Coordinates are percentages of the ORIGINAL
mobile image, not percentages of the screen.
====================================================
*/

const mobileHotspots = {

  portfolio: {
    x: 26.8,
    y: 32.9,
    w: 10.0,
    h: 3.8
  },

  bio: {
    x: 46.0,
    y: 34.2,
    w: 6.0,
    h: 3.8
  },

  manuscript: {
    x: 17.4,
    y: 37.7,
    w: 11.5,
    h: 3.8
  },

  blog: {
    x: 53.6,
    y: 38.6,
    w: 7.0,
    h: 3.8
  },

  newsletter: {
    x: 25.5,
    y: 43.3,
    w: 11.0,
    h: 3.8
  },

  channel: {
    x: 44.3,
    y: 43.3,
    w: 8.5,
    h: 3.8
  }

};


/*
====================================================
POSITION HOTSPOTS
====================================================
*/

function positionHotspots() {

  const image =
    document.querySelector('.image-wrapper img');

  const wrapper =
    document.querySelector('.image-wrapper');

  const isMobile =
    window.innerWidth <= 768 &&
    window.innerHeight > window.innerWidth;


  /*
  -----------------------------------------------
  MOBILE
  -----------------------------------------------

  The mobile photograph is a different image.

  Calculate exactly where that image is displayed
  after object-fit: cover and object-position: 35% 50%.

  This keeps every clickable area attached to
  the actual handwriting.
  -----------------------------------------------
  */

  if (isMobile) {

    const imageNaturalWidth =
      image.naturalWidth;

    const imageNaturalHeight =
      image.naturalHeight;

    const wrapperWidth =
      wrapper.clientWidth;

    const wrapperHeight =
      wrapper.clientHeight;


    /*
    -----------------------------------------------
    Scale required for object-fit: cover
    -----------------------------------------------
    */

    const scale =
      Math.max(
        wrapperWidth / imageNaturalWidth,
        wrapperHeight / imageNaturalHeight
      );


    const displayedWidth =
      imageNaturalWidth * scale;

    const displayedHeight =
      imageNaturalHeight * scale;


    /*
    -----------------------------------------------
    object-position: 35% 50%

    Calculate the amount of crop.
    -----------------------------------------------
    */

    const horizontalOverflow =
      displayedWidth - wrapperWidth;

    const verticalOverflow =
      displayedHeight - wrapperHeight;


    const imageLeft =
      -horizontalOverflow * 0.35;

    const imageTop =
      -verticalOverflow * 0.50;


    /*
    -----------------------------------------------
    Convert ORIGINAL MOBILE IMAGE coordinates
    into actual screen coordinates.
    -----------------------------------------------
    */

    Object.keys(mobileHotspots).forEach(id => {

      const hotspot =
        mobileHotspots[id];

      const link =
        document.getElementById(id);


      const originalX =
        imageNaturalWidth *
        hotspot.x / 100;

      const originalY =
        imageNaturalHeight *
        hotspot.y / 100;

      const originalWidth =
        imageNaturalWidth *
        hotspot.w / 100;

      const originalHeight =
        imageNaturalHeight *
        hotspot.h / 100;


      link.style.left =
        (imageLeft + originalX * scale) + 'px';

      link.style.top =
        (imageTop + originalY * scale) + 'px';

      link.style.width =
        (originalWidth * scale) + 'px';

      link.style.height =
        (originalHeight * scale) + 'px';

    });

    return;

  }


  /*
  -----------------------------------------------
  DESKTOP

  Calculate where the actual image is displayed
  after object-fit: cover.

  This keeps the hotspots attached to the
  photograph even when the viewport ratio changes.
  -----------------------------------------------
  */

  const imageNaturalWidth =
    image.naturalWidth;

  const imageNaturalHeight =
    image.naturalHeight;

  const wrapperWidth =
    wrapper.clientWidth;

  const wrapperHeight =
    wrapper.clientHeight;


  /*
  Scale required for object-fit: cover
  */

  const scale =
    Math.max(
      wrapperWidth / imageNaturalWidth,
      wrapperHeight / imageNaturalHeight
    );


  const displayedWidth =
    imageNaturalWidth * scale;

  const displayedHeight =
    imageNaturalHeight * scale;


  /*
  object-position: 30% 50%

  Calculate the amount of crop.
  */

  const horizontalOverflow =
    displayedWidth - wrapperWidth;

  const verticalOverflow =
    displayedHeight - wrapperHeight;


  const imageLeft =
    -horizontalOverflow * 0.30;

  const imageTop =
    -verticalOverflow * 0.50;


  /*
  -----------------------------------------------
  Convert original-image percentages into
  screen coordinates.
  -----------------------------------------------
  */

  Object.keys(desktopHotspots).forEach(id => {

    const hotspot =
      desktopHotspots[id];

    const link =
      document.getElementById(id);


    const originalX =
      imageNaturalWidth *
      hotspot.x / 100;

    const originalY =
      imageNaturalHeight *
      hotspot.y / 100;

    const originalWidth =
      imageNaturalWidth *
      hotspot.w / 100;

    const originalHeight =
      imageNaturalHeight *
      hotspot.h / 100;


    link.style.left =
      (imageLeft + originalX * scale) + 'px';

    link.style.top =
      (imageTop + originalY * scale) + 'px';

    link.style.width =
      (originalWidth * scale) + 'px';

    link.style.height =
      (originalHeight * scale) + 'px';

  });

}


/*
====================================================
INITIALIZE
====================================================
*/

window.addEventListener(
  'load',
  positionHotspots
);

window.addEventListener(
  'resize',
  positionHotspots
);

window.addEventListener(
  'orientationchange',
  positionHotspots
);

</script>

</body>
</html>
