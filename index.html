<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imantopia</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .image-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% 50%;
      display: block;
    }

    /* All navigation text */
    .text-link {
      position: absolute;
      z-index: 10;

      color: white;
      text-decoration: none;

      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: normal;

      cursor: pointer;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    /* LEFT */

    .manuscript-link {
      top: 20%;
      left: 16%;
    }

    .portfolio-link {
      top: 50%;
      left: 16%;
    }

    .newsletter-link {
      top: 80%;
      left: 16%;
    }

    /* RIGHT */

    .bio-link {
      top: 20%;
      right: 16%;
    }

    .blog-link {
      top: 50%;
      right: 16%;
    }

    .channel-link {
      top: 80%;
      right: 16%;
    }

    /* Mobile portrait */

    @media (max-width: 768px) and (orientation: portrait) {

      .image-wrapper img {
        object-position: 35% 50%;
      }

      .text-link {
        font-size: 14px;
      }

      /* LEFT */

      .manuscript-link {
        top: 20%;
        left: 10%;
      }

      .portfolio-link {
        top: 50%;
        left: 10%;
      }

      .newsletter-link {
        top: 80%;
        left: 10%;
      }

      /* RIGHT */

      .bio-link {
        top: 20%;
        right: 10%;
      }

      .blog-link {
        top: 50%;
        right: 10%;
      }

      .channel-link {
        top: 80%;
        right: 10%;
      }
    }
  </style>
</head>

<body>

  <div class="image-wrapper">

    <img src="imantopia.jpg" alt="Imantopia">

    <!-- LEFT -->

    <a href="/manuscript" class="text-link manuscript-link">
      MANUSCRIPT
    </a>

    <a href="/portfolio" class="text-link portfolio-link">
      PORTFOLIO
    </a>

    <a href="/newsletter" class="text-link newsletter-link">
      NEWSLETTER
    </a>

    <!-- RIGHT -->

    <a href="/bio" class="text-link bio-link">
      BIO
    </a>

    <a href="/blog" class="text-link blog-link">
      BLOG
    </a>

    <a href="/channel" class="text-link channel-link">
      CHANNEL
    </a>

  </div>

</body>
</html>
