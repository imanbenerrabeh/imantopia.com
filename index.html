<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Imantopia</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .image-wrapper {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
      background: #000;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: 30% 50%;

      display: block;
    }


    /* =========================
       MOBILE PORTRAIT
       ========================= */

    @media (max-width: 768px) and (orientation: portrait) {

      .image-wrapper {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;
        height: 100dvh;

        overflow: hidden;
      }

      .image-wrapper img {
        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: 35% 50%;

        display: block;
      }

    }


    /* =========================
       INVISIBLE CLICKABLE AREAS
       ========================= */

    .link {
      position: absolute;

      display: block;

      cursor: pointer;

      touch-action: manipulation;

      -webkit-tap-highlight-color: transparent;
    }

  </style>
</head>


<body>

  <div class="image-wrapper">

    <!--
      Desktop:
      imantopia.jpg

      Mobile portrait:
      mobile-portrait.jpg
    -->

    <picture>

      <source
        srcset="mobile-portrait.jpg"
        media="(max-width: 768px) and (orientation: portrait)"
      >

      <img
        src="imantopia.jpg"
        alt="Imantopia"
      >

    </picture>


    <!-- =========================
         PORTFOLIO — LEFT TOP
         ========================= -->

    <a
      href="/portfolio"
      class="link"

      data-top="0"
      data-left="0"
      data-width="50"
      data-height="33.33"

      data-mobile-top="0"
      data-mobile-left="0"
      data-mobile-width="50"
      data-mobile-height="33.33"
    ></a>


    <!-- =========================
         BIO — RIGHT TOP
         ========================= -->

    <a
      href="/bio"
      class="link"

      data-top="0"
      data-left="50"
      data-width="50"
      data-height="33.33"

      data-mobile-top="0"
      data-mobile-left="50"
      data-mobile-width="50"
      data-mobile-height="33.33"
    ></a>


    <!-- =========================
         MANUSCRIPT — LEFT MIDDLE
         ========================= -->

    <a
      href="/manuscript"
      class="link"

      data-top="33.33"
      data-left="0"
      data-width="50"
      data-height="33.33"

      data-mobile-top="33.33"
      data-mobile-left="0"
      data-mobile-width="50"
      data-mobile-height="33.33"
    ></a>


    <!-- =========================
         BLOG — RIGHT MIDDLE
         ========================= -->

    <a
      href="https://imanbenerrabeh.com"
      class="link"

      data-top="33.33"
      data-left="50"
      data-width="50"
      data-height="33.33"

      data-mobile-top="33.33"
      data-mobile-left="50"
      data-mobile-width="50"
      data-mobile-height="33.33"
    ></a>


    <!-- =========================
         NEWSLETTER — LEFT BOTTOM
         ========================= -->

    <a
      href="https://buttondown.com/imanbenerrabeh"
      class="link"

      data-top="66.66"
      data-left="0"
      data-width="50"
      data-height="33.34"

      data-mobile-top="66.66"
      data-mobile-left="0"
      data-mobile-width="50"
      data-mobile-height="33.34"
    ></a>


    <!-- =========================
         CHANNEL — RIGHT BOTTOM
         ========================= -->

    <a
      href="https://www.youtube.com/@imanbenerrabeh"
      class="link"

      data-top="66.66"
      data-left="50"
      data-width="50"
      data-height="33.34"

      data-mobile-top="66.66"
      data-mobile-left="50"
      data-mobile-width="50"
      data-mobile-height="33.34"
    ></a>

  </div>


  <script>

    const links = document.querySelectorAll('.link');
    const container = document.querySelector('.image-wrapper');


    function updateLinks() {

      const containerWidth =
        container.offsetWidth;

      const containerHeight =
        container.offsetHeight;


      const isMobilePortrait =
        window.innerWidth <= 768 &&
        window.innerHeight > window.innerWidth;


      links.forEach(link => {

        let topPercent;
        let leftPercent;
        let widthPercent;
        let heightPercent;


        if (isMobilePortrait) {

          topPercent =
            parseFloat(link.dataset.mobileTop);

          leftPercent =
            parseFloat(link.dataset.mobileLeft);

          widthPercent =
            parseFloat(link.dataset.mobileWidth);

          heightPercent =
            parseFloat(link.dataset.mobileHeight);

        } else {

          topPercent =
            parseFloat(link.dataset.top);

          leftPercent =
            parseFloat(link.dataset.left);

          widthPercent =
            parseFloat(link.dataset.width);

          heightPercent =
            parseFloat(link.dataset.height);

        }


        link.style.top =
          (containerHeight * topPercent / 100) + 'px';


        link.style.left =
          (containerWidth * leftPercent / 100) + 'px';


        link.style.width =
          (containerWidth * widthPercent / 100) + 'px';


        link.style.height =
          (containerHeight * heightPercent / 100) + 'px';

      });

    }


    window.addEventListener(
      'load',
      updateLinks
    );

    window.addEventListener(
      'resize',
      updateLinks
    );

    window.addEventListener(
      'orientationchange',
      updateLinks
    );


    updateLinks();

  </script>

</body>
</html>
