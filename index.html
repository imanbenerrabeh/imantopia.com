<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Imantopia</title>

<style>

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
}

body {
  position: fixed;
  inset: 0;
}

.image-wrapper {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  background: #000;

  z-index: 0;
}

.image-wrapper img {
  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: 30% 50%;

  display: block;

  /* The image must never steal the tap from the links */
  pointer-events: none;
}


/* =================================
   INVISIBLE CLICKABLE AREAS
   ================================= */

.link {
  position: absolute;

  display: block;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;

  background: transparent;

  /* Keep links above the photograph */
  z-index: 100;

  pointer-events: auto;
}


/* =================================
   MOBILE PORTRAIT
   ================================= */

@media (max-width: 768px) and (orientation: portrait) {

  .image-wrapper img {
    object-position: 35% 50%;
  }

}

</style>

</head>


<body>

<div class="image-wrapper">

  <picture>

    <source
      srcset="mobile-portrait.jpg"
      media="(max-width: 768px) and (orientation: portrait)"
    >

    <img
      src="imantopia.jpg"
      alt="Imantopia"
    >

  </picture>


  <!-- ==============================
       PORTFOLIO
       ============================== -->

  <a
    href="/portfolio"
    class="link"
    id="portfolio"
  ></a>


  <!-- ==============================
       BIO
       ============================== -->

  <a
    href="/bio"
    class="link"
    id="bio"
  ></a>


  <!-- ==============================
       MANUSCRIPT
       ============================== -->

  <a
    href="/manuscript"
    class="link"
    id="manuscript"
  ></a>


  <!-- ==============================
       BLOG
       ============================== -->

  <a
    href="https://imanbenerrabeh.com"
    class="link"
    id="blog"
  ></a>


  <!-- ==============================
       NEWSLETTER
       ============================== -->

  <a
    href="https://buttondown.com/imanbenerrabeh"
    class="link"
    id="newsletter"
  ></a>


  <!-- ==============================
       CHANNEL
       ============================== -->

  <a
    href="https://www.youtube.com/@imanbenerrabeh"
    class="link"
    id="channel"
  ></a>

</div>


<script>

/*
====================================================
DESKTOP HOTSPOTS
====================================================

DESKTOP IS UNCHANGED.

Coordinates are based on the actual writing
in imantopia.jpg.
====================================================
*/

const desktopHotspots = {

  portfolio: {
    x: 37.0,
    y: 29.5,
    w: 9.0,
    h: 5.5
  },

  bio: {
    x: 53.5,
    y: 32.0,
    w: 6.5,
    h: 5.5
  },

  manuscript: {
    x: 28.0,
    y: 41.0,
    w: 10.5,
    h: 5.5
  },

  blog: {
    x: 62.0,
    y: 43.0,
    w: 7.0,
    h: 5.5
  },

  newsletter: {
    x: 35.0,
    y: 55.5,
    w: 10.0,
    h: 6.0
  },

  channel: {
    x: 54.0,
    y: 55.0,
    w: 9.0,
    h: 6.0
  }

};


/*
====================================================
MOBILE HOTSPOTS
====================================================

CALIBRATED TO THE SUPPLIED MOBILE-PORTRAIT IMAGE.

These boxes are positioned over the ACTUAL
handwritten words.

They are NOT six screen quadrants.

Coordinates are percentages of the ORIGINAL
mobile image.

The boxes intentionally stay around the writing
rather than extending along the arrows.
====================================================
*/

const mobileHotspots = {

  /* "portfolio" */
  portfolio: {
    x: 34.0,
    y: 41.0,
    w: 11.0,
    h: 2.2
  },

  /* "bio" */
  bio: {
    x: 58.0,
    y: 42.1,
    w: 5.5,
    h: 2.2
  },

  /* "manuscript" */
  manuscript: {
    x: 23.0,
    y: 46.3,
    w: 11.0,
    h: 2.2
  },

  /* "blog" */
  blog: {
    x: 67.5,
    y: 47.7,
    w: 6.0,
    h: 2.2
  },

  /* "newsletter" */
  newsletter: {
    x: 29.0,
    y: 54.2,
    w: 10.5,
    h: 2.2
  },

  /* "channel" */
  channel: {
    x: 57.0,
    y: 54.2,
    w: 10.0,
    h: 2.2
  }

};


/*
====================================================
POSITION HOTSPOTS
====================================================
*/

function positionHotspots() {

  const image =
    document.querySelector('.image-wrapper img');

  const wrapper =
    document.querySelector('.image-wrapper');


  if (!image.complete || !image.naturalWidth) {
    return;
  }


  const isMobile =
    window.innerWidth <= 768 &&
    window.innerHeight > window.innerWidth;


  /*
  ================================================
  MOBILE
  ================================================
  */

  if (isMobile) {

    const imageNaturalWidth =
      image.naturalWidth;

    const imageNaturalHeight =
      image.naturalHeight;

    const wrapperWidth =
      wrapper.clientWidth;

    const wrapperHeight =
      wrapper.clientHeight;


    /*
    -----------------------------------------------
    object-fit: cover
    -----------------------------------------------
    */

    const scale =
      Math.max(
        wrapperWidth / imageNaturalWidth,
        wrapperHeight / imageNaturalHeight
      );


    const displayedWidth =
      imageNaturalWidth * scale;

    const displayedHeight =
      imageNaturalHeight * scale;


    /*
    -----------------------------------------------
    object-position: 35% 50%
    -----------------------------------------------
    */

    const horizontalOverflow =
      displayedWidth - wrapperWidth;

    const verticalOverflow =
      displayedHeight - wrapperHeight;


    const imageLeft =
      -horizontalOverflow * 0.35;

    const imageTop =
      -verticalOverflow * 0.50;


    /*
    -----------------------------------------------
    Convert original mobile-image coordinates
    into actual screen coordinates.
    -----------------------------------------------
    */

    Object.keys(mobileHotspots).forEach(id => {

      const hotspot =
        mobileHotspots[id];

      const link =
        document.getElementById(id);


      if (!link) return;


      const originalX =
        imageNaturalWidth *
        hotspot.x / 100;

      const originalY =
        imageNaturalHeight *
        hotspot.y / 100;

      const originalWidth =
        imageNaturalWidth *
        hotspot.w / 100;

      const originalHeight =
        imageNaturalHeight *
        hotspot.h / 100;


      link.style.left =
        (imageLeft + originalX * scale) + 'px';

      link.style.top =
        (imageTop + originalY * scale) + 'px';

      link.style.width =
        (originalWidth * scale) + 'px';

      link.style.height =
        (originalHeight * scale) + 'px';

    });


    return;

  }


  /*
  ================================================
  DESKTOP
  ================================================

  DESKTOP CODE BELOW IS KEPT AS-IS.
  ================================================
  */

  const imageNaturalWidth =
    image.naturalWidth;

  const imageNaturalHeight =
    image.naturalHeight;

  const wrapperWidth =
    wrapper.clientWidth;

  const wrapperHeight =
    wrapper.clientHeight;


  /*
  -----------------------------------------------
  Scale required for object-fit: cover
  -----------------------------------------------
  */

  const scale =
    Math.max(
      wrapperWidth / imageNaturalWidth,
      wrapperHeight / imageNaturalHeight
    );


  const displayedWidth =
    imageNaturalWidth * scale;

  const displayedHeight =
    imageNaturalHeight * scale;


  /*
  -----------------------------------------------
  object-position: 30% 50%
  -----------------------------------------------
  */

  const horizontalOverflow =
    displayedWidth - wrapperWidth;

  const verticalOverflow =
    displayedHeight - wrapperHeight;


  const imageLeft =
    -horizontalOverflow * 0.30;

  const imageTop =
    -verticalOverflow * 0.50;


  /*
  -----------------------------------------------
  Convert original-image percentages into
  screen coordinates.
  -----------------------------------------------
  */

  Object.keys(desktopHotspots).forEach(id => {

    const hotspot =
      desktopHotspots[id];

    const link =
      document.getElementById(id);


    if (!link) return;


    const originalX =
      imageNaturalWidth *
      hotspot.x / 100;

    const originalY =
      imageNaturalHeight *
      hotspot.y / 100;

    const originalWidth =
      imageNaturalWidth *
      hotspot.w / 100;

    const originalHeight =
      imageNaturalHeight *
      hotspot.h / 100;


    link.style.left =
      (imageLeft + originalX * scale) + 'px';

    link.style.top =
      (imageTop + originalY * scale) + 'px';

    link.style.width =
      (originalWidth * scale) + 'px';

    link.style.height =
      (originalHeight * scale) + 'px';

  });

}


/*
====================================================
INITIALIZE
====================================================
*/

function initializeHotspots() {

  const image =
    document.querySelector('.image-wrapper img');

  if (image.complete && image.naturalWidth) {
    positionHotspots();
  }

}


window.addEventListener(
  'load',
  initializeHotspots
);


window.addEventListener(
  'resize',
  positionHotspots
);


window.addEventListener(
  'orientationchange',
  positionHotspots
);


/*
Recalculate once the mobile image has actually
loaded, including when the <picture> source
changes.
*/

document
  .querySelector('.image-wrapper img')
  .addEventListener(
    'load',
    positionHotspots
  );

</script>

</body>

</html>
